[workspace]
members = [
    "bench",
    "crates/conformance",
    "crates/differential",
    "crates/examples",
    "crates/rustscript",
]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.23"
chrono = "0.4"
colored = "3.1"
compact_str = "0.10"
crossterm = "0.29"
ctrlc = "3.5"
dirs = "6.0"
encoding_rs = "0.8"
flate2 = "1.1"
glob = "0.3"
hex = "0.4"
indexmap = "2"
indicatif = "0.18"
jsonwebtoken = { version = "11.0", features = ["rust_crypto"] }
libc = "0.2"
lopdf = "0.44"
mimalloc = "0.1"
num-traits = "0.2"
parking_lot = "0.12"
# ab_glyph rasterizes text in pure Rust. The ttf feature would pull font-kit,
# which links system freetype and fontconfig and makes the build depend on
# what each machine happens to have installed.
plotters = { version = "0.3", default-features = false, features = [
    "ab_glyph",
    "all_series",
    "bitmap_backend",
    "bitmap_encoder",
] }
pretty_assertions = "1.4"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quote = "1.0"
rand = "0.10"
ratatui = { version = "0.30", default-features = false }
regex = "1.13"
reqwest = { version = "0.13", features = [
    "blocking",
    "cookies",
    "json",
    "query",
    "rustls",
], default-features = false }
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.11"
syn = { version = "3.0", features = ["extra-traits", "full"] }
tar = "0.4"
tempfile = "3.27"
terminal-light = "1.9"
tokio = { version = "1", features = ["full"] }
toml = "1.1"
which = "8.0"
windows-service = "0.8"
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_Threading"] }
winreg = "0.56"
wmi = "0.18"
xmltree = { version = "0.12", features = ["attribute-order"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

explicit_deref_methods = "allow"
format_push_string = "allow"
inline_always = "allow"
manual_assert = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
module_inception = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
new_without_default = "allow"
return_self_not_must_use = "allow"
struct_field_names = "allow"
unnecessary_box_returns = "allow"
