[package]
name = "run-rs"
version = "0.6.24"
edition = "2024"
description = "Run a subset of Rust as an interpreted script"
repository = "https://github.com/VladasZ/rustscript"
license = "MIT OR Apache-2.0"
readme = "../../README.md"
keywords = ["rust", "scripting", "interpreter", "automation", "cli"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.98"

# The crates a script may use without declaring anything. `rust check` compiles the script
# against these entries of `[dependencies]` below, rendered by build.rs, so the checker and the
# bridges always agree on versions and features.
[package.metadata.rustscript]
script-crates = [
    "anyhow",
    "base64",
    "chrono",
    "colored",
    "crossterm",
    "ctrlc",
    "dirs",
    "ed25519-dalek",
    "glob",
    "hex",
    "jsonwebtoken",
    "lopdf",
    "rand",
    "ratatui",
    "regex",
    "reqwest",
    "serde",
    "serde_json",
    "serde_yaml",
    "sha2",
    "tempfile",
    "terminal-light",
    "tokio",
    "toml",
    "which",
    "windows-service",
    "winreg",
    "wmi",
    "xmltree",
]

[[bin]]
name = "rust"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
syn = { workspace = true }
proc-macro2 = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
reqwest = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
regex = { workspace = true }
indexmap = { workspace = true }
which = { workspace = true }
rand = { workspace = true }
glob = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
toml = { workspace = true }
serde_yaml = { workspace = true }
colored = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
ctrlc = { workspace = true }
tempfile = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
mimalloc = { workspace = true }
jsonwebtoken = { workspace = true }
lopdf = { workspace = true }
xmltree = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
indicatif = { workspace = true }
zip = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
terminal-light = { workspace = true }
num-traits = { workspace = true }
quote = { workspace = true }
stacker = { workspace = true }

# Not a default feature on purpose. parking_lot's detector tracks the owner
# of every lock, which costs on each acquisition, so only test builds carry
# it. CI enables it so a lock cycle aborts with backtraces of every thread in
# the cycle instead of hanging until the suite timeout fires.
[features]
deadlock-detection = ["parking_lot/deadlock_detection"]

[dev-dependencies]
pretty_assertions = { workspace = true }

[build-dependencies]
chrono = { workspace = true }
proc-macro2 = { workspace = true }
serde = { workspace = true }
syn = { workspace = true, features = ["visit"] }
toml = { workspace = true }

[target."cfg(windows)".dependencies]
encoding_rs = { workspace = true }
windows-service = { workspace = true }
windows-sys = { workspace = true }
winreg = { workspace = true }
wmi = { workspace = true }

[target."cfg(unix)".dependencies]
libc = { workspace = true }

[lints]
workspace = true
