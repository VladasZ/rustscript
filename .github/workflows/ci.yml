name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all -- --check

  typos:
    name: Typos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1.49.0

  clippy:
    name: Clippy ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --features run-rs/deadlock-detection -- -D warnings
      # unwrap is banned in project code. The script corpus keeps it because unwrap is a
      # language feature under test there, and tests keep it too, so the deny pass covers
      # only the lib and bin targets of the real crates. The bench crate mixes corpus bins
      # with real ones, so its real targets are named one by one.
      - run: cargo clippy --workspace --exclude rustscript-examples --exclude rustscript-conformance --exclude rustscript-bench --lib --bins --features run-rs/deadlock-detection -- -D warnings -D clippy::unwrap-used
      - run: cargo clippy -p rustscript-bench --lib --bin bench --bin chart --bin gendata -- -D warnings -D clippy::unwrap-used

  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      # The deadlock detector rides along in every suite that runs scripts,
      # so a lock cycle aborts the run with backtraces instead of hanging
      # until the harness timeout.
      - run: cargo test --workspace --features run-rs/deadlock-detection
