name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all -- --check

  typos:
    name: Typos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1.50.0

  clippy:
    name: Clippy ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets --features run-rs/deadlock-detection -- -D warnings

  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      # The deadlock detector rides along in every suite that runs scripts,
      # so a lock cycle aborts the run with backtraces instead of hanging
      # until the harness timeout.
      - run: cargo test --locked --workspace --features run-rs/deadlock-detection

  check-gate:
    name: Check gate ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      # These tests run a real `cargo check` on the manifest in checker.rs,
      # which compiles every bridged crate once. Too slow for the default
      # local loop, so they are ignored there and run only here. Without
      # this job `rust check` and `rust build` have no end to end coverage.
      - run: cargo test --locked -p run-rs --features deadlock-detection --test check --test run -- --ignored
